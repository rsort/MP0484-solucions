<script>

function cSQL(t){
  t=t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  t=t.replace(/(--[^\n]*)/g,'<span class="cmt">$1</span>');
  t=t.replace(/('[^']*')/g,'<span class="str">$1</span>');
  t=t.replace(/\b(\d+\.?\d*)\b/g,'<span class="num">$1</span>');
  t=t.replace(/\b(SELECT|FROM|WHERE|AND|OR|NOT|IN|LIKE|BETWEEN|IS|NULL|ORDER\s+BY|GROUP\s+BY|HAVING|DISTINCT|AS|ASC|DESC|CASE|WHEN|THEN|ELSE|END|JOIN|INNER\s+JOIN|NATURAL\s+JOIN|LEFT\s+OUTER\s+JOIN|LEFT\s+JOIN|RIGHT\s+OUTER\s+JOIN|FULL\s+OUTER\s+JOIN|ON|USING|UNION|UNION\s+ALL|INTERSECT|MINUS|EXISTS|NOT\s+EXISTS|ANY|ALL|NOT\s+IN|OFFSET|FETCH\s+FIRST|ROWS\s+ONLY|NEXT)\b/gi,'<span class="kw">$1</span>');
  t=t.replace(/\b(COUNT|SUM|AVG|MAX|MIN|ROUND|TRUNC|NVL|TO_CHAR|TO_NUMBER|TO_DATE|SYSDATE|DECODE|LOWER|UPPER|MONTHS_BETWEEN|DBMS_XPLAN|DISPLAY)\b/gi,'<span class="fn">$1</span>');
  return t;
}
function reveal(btn,id){
  document.getElementById(id).classList.add('show');
  btn.style.display='none';
}
function openFromHash(){
  var hash=location.hash.slice(1);
  if(!hash) return;
  var target=document.getElementById(hash);
  if(!target) return;
  var btn=target.querySelector('.ri-btn');
  var ans=target.querySelector('.ri-ans');
  if(btn && ans){ ans.classList.add('show'); btn.style.display='none'; }
  setTimeout(function(){ target.scrollIntoView({behavior:'smooth',block:'start'}); },150);
}
window.addEventListener('load', openFromHash);
window.addEventListener('hashchange', openFromHash);


var EXDATA_T9 = [
  {n:1, txt:'Una condició <code>WHERE UPPER(last_name) = \'KING\'</code> sobre una columna indexada. Oracle usarà l\'índex?',
   sol:`-- NO usarà l'índex perquè hi ha una funció sobre la columna indexada.
-- La condició NO és sargable.

-- Alternativa sargable:
SELECT last_name FROM employees
WHERE  last_name = 'King';   -- Oracle busca exactament 'King'

-- O si es vol insensible a majúscules amb índex:
-- Cal crear un índex funcional:
-- CREATE INDEX idx_upper_ln ON employees(UPPER(last_name));
-- Llavors: WHERE UPPER(last_name) = 'KING' usaria l'índex.`},
  {n:2, txt:'Reescriu aquesta condició perquè sigui sargable i pugui aprofitar un índex sobre <code>hire_date</code>:<br><code>WHERE TO_CHAR(hire_date, \'YYYY\') = \'2005\'</code>',
   sol:`-- Original (NO sargable: funció sobre columna indexada):
-- WHERE TO_CHAR(hire_date, 'YYYY') = '2005'

-- Versió sargable (la funció és sobre el LITERAL, no sobre la columna):
WHERE hire_date >= TO_DATE('01/01/2005', 'DD/MM/YYYY')
  AND hire_date <  TO_DATE('01/01/2006', 'DD/MM/YYYY');`,
   note:'En la versió sargable, hire_date apareix nua al WHERE, de manera que Oracle pot usar directament l\'índex sobre hire_date per localitzar les files de 2005.'},
  {n:3, txt:'Per què <code>NOT IN</code> pot ser perillós quan la subconsulta pot retornar NULLs? Escriu l\'alternativa recomanada per trobar empleats que no han tingut càrrecs anteriors.',
   sol:`-- PROBLEMA: si job_history té files amb employee_id NULL,
-- NOT IN retorna 0 files (cap resultat) perquè:
-- qualsevol comparació amb NULL dona UNKNOWN (ni true ni false).

-- VERSIÓ PERILLOSA:
SELECT last_name FROM employees
WHERE  employee_id NOT IN (SELECT employee_id FROM job_history);
-- Si hi ha un NULL a job_history.employee_id → retorna 0 files!

-- ALTERNATIVA SEGURA amb NOT EXISTS:
SELECT last_name FROM employees e
WHERE NOT EXISTS (SELECT 1 FROM job_history jh
                  WHERE  jh.employee_id = e.employee_id);`,
   note:'NOT EXISTS no té el problema dels NULLs: busca si existeix alguna fila correlacionada, i si no n\'existeix cap, inclou l\'empleat al resultat.'},
  {n:4, txt:'Mostra els 3 empleats amb salari més alt. Usa la sintaxi moderna de paginació (Oracle 12c+).',
   sol:`SELECT employee_id, last_name, salary
FROM   employees
ORDER BY salary DESC
FETCH FIRST 3 ROWS ONLY;`},
  {n:5, txt:'Explica per qué cal usar <code>UNION ALL</code> en lloc de <code>UNION</code> en la consulta: càrrecs del mes actual de EMPLOYEES units als mateixos càrrecs de l\'any passat de JOB_HISTORY (pot haver-hi duplicats però no ens importa).',
   sol:`-- UNION elimina duplicats (ordena i compara totes les files): més lent.
-- UNION ALL simplement concatena els dos resultats: més ràpid.
-- Si els duplicats no importa conservar-los o eliminar-los,
-- i sabem que n'hi haurà, UNION ALL és preferible per rendiment.

SELECT job_id FROM employees
UNION ALL
SELECT job_id FROM job_history;

-- Ús correcte de UNION (amb deduplicació) quan sí que importa:
SELECT job_id FROM employees
UNION
SELECT job_id FROM job_history;`}
];
var TOPIC = 't9';

EXDATA_T9.forEach(function(ex) {
  var c = document.getElementById('ex-body');
  var div = document.createElement('div');
  div.className = 'exercise';
  div.id = TOPIC + '-ex' + ex.n;
  var note = ex.note ? '<div class="ri-note">'+ex.note+'</div>' : '';
  var ansId = 'ans_' + TOPIC + '_' + ex.n;
  var sqlId = 'sql_' + TOPIC + '_' + ex.n;
  div.innerHTML =
    '<div class="ex-head">' +
      '<div class="ex-num">' + ex.n + '</div>' +
      '<div><div class="ex-name">Exercici ' + ex.n + '</div></div>' +
    '</div>' +
    '<div class="ex-enunciat">' + ex.txt + '</div>' +
    '<button class="ri-btn" onclick="reveal(this,\'' + ansId + '\')">&#9654; Veure soluci&#243;</button>' +
    '<div class="ri-ans" id="' + ansId + '">' +
      '<div class="ri-ans-label">Soluci&#243;</div>' +
      '<code class="sql-out" id="' + sqlId + '"></code>' +
      note +
    '</div>';
  c.appendChild(div);
  var sqlEl = document.getElementById(sqlId);
  if (sqlEl) sqlEl.innerHTML = cSQL(ex.sol);
});
