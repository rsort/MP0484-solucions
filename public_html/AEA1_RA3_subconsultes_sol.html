<script>

function cSQL(t){
  t=t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  t=t.replace(/(--[^\n]*)/g,'<span class="cmt">$1</span>');
  t=t.replace(/('[^']*')/g,'<span class="str">$1</span>');
  t=t.replace(/\b(\d+\.?\d*)\b/g,'<span class="num">$1</span>');
  t=t.replace(/\b(SELECT|FROM|WHERE|AND|OR|NOT|IN|LIKE|BETWEEN|IS|NULL|ORDER\s+BY|GROUP\s+BY|HAVING|DISTINCT|AS|ASC|DESC|CASE|WHEN|THEN|ELSE|END|JOIN|INNER\s+JOIN|NATURAL\s+JOIN|LEFT\s+OUTER\s+JOIN|LEFT\s+JOIN|RIGHT\s+OUTER\s+JOIN|FULL\s+OUTER\s+JOIN|ON|USING|UNION|UNION\s+ALL|INTERSECT|MINUS|EXISTS|NOT\s+EXISTS|ANY|ALL|NOT\s+IN|UNDEFINE)\b/gi,'<span class="kw">$1</span>');
  t=t.replace(/\b(COUNT|SUM|AVG|MAX|MIN|ROUND|TRUNC|NVL|TO_CHAR|TO_NUMBER|TO_DATE|SYSDATE|DECODE|LOWER|UPPER|MONTHS_BETWEEN)\b/gi,'<span class="fn">$1</span>');
  return t;
}
function reveal(btn,id){
  document.getElementById(id).classList.add('show');
  btn.style.display='none';
}
function openFromHash(){
  var hash=location.hash.slice(1);
  if(!hash) return;
  var target=document.getElementById(hash);
  if(!target) return;
  var btn=target.querySelector('.ri-btn');
  var ans=target.querySelector('.ri-ans');
  if(btn && ans){ ans.classList.add('show'); btn.style.display='none'; }
  setTimeout(function(){ target.scrollIntoView({behavior:'smooth',block:'start'}); },150);
}
window.addEventListener('load', openFromHash);
window.addEventListener('hashchange', openFromHash);


var EXDATA_T7 = [
  {n:1,txt:'Mostra el cognom i la data de contractació de tots els empleats del mateix departament que l\'empleat indicat per l\'usuari (excepte l\'empleat en qüestió).',
   sol:`UNDEFINE Enter_name\n\nSELECT last_name, hire_date\nFROM   employees\nWHERE  department_id = (SELECT department_id\n                         FROM   employees\n                         WHERE  last_name = '&&Enter_name')\n  AND  last_name <> '&Enter_name';`,
   note:'&&Enter_name (doble &) defineix la variable i la reutilitza. Prova amb Zlotkey.'},
  {n:2,txt:'Mostra el número d\'empleat, cognom i salari de tots els empleats que guanyen més del salari mitjà. Ordena per salari ascendent.',
   sol:`SELECT employee_id, last_name, salary\nFROM   employees\nWHERE  salary > (SELECT AVG(salary)\n                 FROM   employees)\nORDER BY salary;`},
  {n:3,txt:'Mostra el número d\'empleat i el cognom de tots els empleats que treballen en un departament amb algun empleat el cognom del qual contingui una "u".',
   sol:`SELECT employee_id, last_name\nFROM   employees\nWHERE  department_id IN (SELECT department_id\n                          FROM   employees\n                          WHERE  last_name LIKE '%u%');`},
  {n:4,txt:'Mostra el cognom, número de departament i JOB_ID de tots els empleats el departament dels quals es trobi a la ubicació 1700. Modifica-la per demanar la ubicació a l\'usuari.',
   sol:`-- Versió fixa\nSELECT last_name, department_id, job_id\nFROM   employees\nWHERE  department_id IN (SELECT department_id\n                          FROM   departments\n                          WHERE  location_id = 1700);\n\n-- Versió amb variable de substitució\nSELECT last_name, department_id, job_id\nFROM   employees\nWHERE  department_id IN (SELECT department_id\n                          FROM   departments\n                          WHERE  location_id = &Enter_location);`},
  {n:5,txt:'Mostra el cognom i salari de tots els empleats que treballen sota les ordres de Steven King.',
   sol:`SELECT last_name, salary\nFROM   employees\nWHERE  manager_id = (SELECT employee_id\n                      FROM   employees\n                      WHERE  first_name = 'Steven'\n                        AND  last_name  = 'King');`},
  {n:6,txt:'Mostra el número de departament, cognom i JOB_ID de cada empleat del departament Executive.',
   sol:`SELECT department_id, last_name, job_id\nFROM   employees\nWHERE  department_id = (SELECT department_id\n                         FROM   departments\n                         WHERE  department_name = 'Executive');`},
  {n:7,txt:'Mostra tots els empleats amb salari superior al de QUALSEVOL empleat del departament 60.',
   sol:`SELECT last_name\nFROM   employees\nWHERE  salary > ALL (SELECT salary\n                     FROM   employees\n                     WHERE  department_id = 60);`,
   note:'> ALL significa "major que tots els valors", equivalent a "major que el màxim". > ANY significaria "major que almenys un", equivalent a "major que el mínim".'},
  {n:8,txt:'Mostra el número d\'empleat, cognom i salari dels empleats que guanyen més del salari mig I treballen en un departament amb algun empleat el cognom del qual contingui una "u".',
   sol:`SELECT employee_id, last_name, salary\nFROM   employees\nWHERE  department_id IN (SELECT department_id\n                          FROM   employees\n                          WHERE  last_name LIKE '%u%')\n  AND  salary > (SELECT AVG(salary)\n                 FROM   employees);`}
];

var TOPIC = 't7';

EXDATA_T7.forEach(function(ex) {
  var c = document.getElementById('ex-body');
  var div = document.createElement('div');
  div.className = 'exercise';
  div.id = TOPIC + '-ex' + ex.n;
  var note = ex.note ? '<div class="ri-note">'+ex.note+'</div>' : '';
  var ansId = 'ans_' + TOPIC + '_' + ex.n;
  var sqlId = 'sql_' + TOPIC + '_' + ex.n;
  div.innerHTML =
    '<div class="ex-head">' +
      '<div class="ex-num">' + ex.n + '</div>' +
      '<div><div class="ex-name">Exercici ' + ex.n + '</div></div>' +
    '</div>' +
    '<div class="ex-enunciat">' + ex.txt + '</div>' +
    '<button class="ri-btn" onclick="reveal(this,\'' + ansId + '\')">&#9654; Veure soluci&#243;</button>' +
    '<div class="ri-ans" id="' + ansId + '">' +
      '<div class="ri-ans-label">Soluci&#243;</div>' +
      '<code class="sql-out" id="' + sqlId + '"></code>' +
      note +
    '</div>';
  c.appendChild(div);
  var sqlEl = document.getElementById(sqlId);
  if (sqlEl) sqlEl.innerHTML = cSQL(ex.sol);
});
</script>
