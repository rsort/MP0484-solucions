*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  --bg:#f7f5f0; --card:#ffffff; --ink:#1c1917; --ink-2:#57534e; --ink-3:#a8a29e;

.ex-num { min-width:30px; height:30px; background:var(--accent-mid); color:#fff; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:600; flex-shrink:0; }

.ex-enunciat code { font-family:'JetBrains Mono',monospace; font-size:12px; background:var(--accent-bg); padding:1px 6px; border-radius:3px; color:var(--accent); }

.sql-out { font-family:'JetBrains Mono',monospace; font-size:13px; background:var(--code-bg); color:var(--code-text); padding:16px 20px; border-radius:var(--r-sm); line-height:1.8; white-space:pre; display:block; overflow-x:auto; }
.site-foot { border-top:1px solid var(--border); padding:20px 24px; margin-top:48px; }

.kw { color:#fbbf24; font-weight:500; }
.fn { color:#a78bfa; }
.str { color:#4ade80; }

<body>

<header class="site-head">
  <div class="head-inner">

</footer>

<script>

function cSQL(t){
  t=t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  t=t.replace(/(--[^\n]*)/g,'<span class="cmt">$1</span>');
  t=t.replace(/('[^']*')/g,'<span class="str">$1</span>');
  t=t.replace(/\b(\d+\.?\d*)\b/g,'<span class="num">$1</span>');
  t=t.replace(/\b(SELECT|FROM|WHERE|AND|OR|NOT|IN|LIKE|BETWEEN|IS|NULL|ORDER\s+BY|GROUP\s+BY|HAVING|DISTINCT|AS|ASC|DESC|CASE|WHEN|THEN|ELSE|END|JOIN|INNER\s+JOIN|NATURAL\s+JOIN|LEFT\s+OUTER\s+JOIN|LEFT\s+JOIN|RIGHT\s+OUTER\s+JOIN|FULL\s+OUTER\s+JOIN|ON|USING|UNION|UNION\s+ALL|INTERSECT|MINUS|EXISTS|NOT\s+EXISTS|ANY|ALL|NOT\s+IN|UNDEFINE)\b/gi,'<span class="kw">$1</span>');
  t=t.replace(/\b(COUNT|SUM|AVG|MAX|MIN|ROUND|TRUNC|NVL|TO_CHAR|TO_NUMBER|TO_DATE|SYSDATE|DECODE|LOWER|UPPER|MONTHS_BETWEEN)\b/gi,'<span class="fn">$1</span>');
  return t;
}
function reveal(btn,id){
  document.getElementById(id).classList.add('show');
  btn.style.display='none';
}
function openFromHash(){
  var hash=location.hash.slice(1);
  if(!hash) return;
  var target=document.getElementById(hash);
  if(!target) return;
  var btn=target.querySelector('.ri-btn');
  var ans=target.querySelector('.ri-ans');
  if(btn && ans){ ans.classList.add('show'); btn.style.display='none'; }
  setTimeout(function(){ target.scrollIntoView({behavior:'smooth',block:'start'}); },150);
}
window.addEventListener('load', openFromHash);
window.addEventListener('hashchange', openFromHash);


var EXDATA_T6 = [
  {n:1,txt:'Genera les adreces de tots els departaments. Utilitza les taules LOCATIONS i COUNTRIES. Mostra ID ubicació, adreça, ciutat, estat/província i país. Usa NATURAL JOIN.',
   sol:`SELECT location_id, street_address, city,\n       state_province, country_name\nFROM   locations\nNATURAL JOIN countries;`},
  {n:2,txt:'Mostra el cognom, número i nom del departament de tots els empleats.',
   sol:`SELECT last_name, department_id, department_name\nFROM   employees\nJOIN   departments USING (department_id);`},
  {n:3,txt:'Mostra el cognom, càrrec, número i nom del departament de tots els empleats que treballen a Toronto.',
   sol:`SELECT e.last_name, e.job_id, e.department_id, d.department_name\nFROM   employees   e\nJOIN   departments d ON (e.department_id = d.department_id)\nJOIN   locations   l ON (d.location_id   = l.location_id)\nWHERE  LOWER(l.city) = 'toronto';`},
  {n:4,txt:'Mostra el cognom i número de l\'empleat juntament amb el cognom i número del seu cap. Etiqueta les columnes Employee, Emp#, Manager i Mgr#.',
   sol:`SELECT w.last_name "Employee", w.employee_id "EMP#",\n       m.last_name "Manager",  m.employee_id "Mgr#"\nFROM   employees w\nJOIN   employees m ON (w.manager_id = m.employee_id);`,
   note:'Self-join: la taula EMPLOYEES s\'uneix amb ella mateixa. W = worker (empleat), M = manager (cap).'},
  {n:5,txt:'Modifica la consulta anterior per mostrar també King, que no té cap. Ordena per número d\'empleat.',
   sol:`SELECT w.last_name "Employee", w.employee_id "EMP#",\n       m.last_name "Manager",  m.employee_id "Mgr#"\nFROM   employees w\nLEFT OUTER JOIN employees m ON (w.manager_id = m.employee_id)\nORDER BY 2;`,
   note:'LEFT OUTER JOIN inclou totes les files de la taula esquerra (w). El president (King) apareix amb NULL a les columnes del cap.'},
  {n:6,txt:'Mostra el departament, cognom de l\'empleat i cognom del company (company = empleat del mateix departament, diferent de l\'empleat). Ordena per departament, empleat i company.',
   sol:`SELECT e.department_id department,\n       e.last_name employee,\n       c.last_name colleague\nFROM   employees e\nJOIN   employees c ON (e.department_id = c.department_id)\nWHERE  e.employee_id <> c.employee_id\nORDER BY e.department_id, e.last_name, c.last_name;`},
  {n:7,txt:'Mostra el cognom, càrrec, nom del departament, salari i grau salarial de tots els empleats. Primer fes DESCRIBE de la taula JOB_GRADES.',
   sol:`DESC JOB_GRADES\n\nSELECT e.last_name, e.job_id, d.department_name,\n       e.salary, j.grade\nFROM   employees   e\nJOIN   departments d ON (e.department_id = d.department_id)\nJOIN   job_grades  j ON (e.salary BETWEEN j.lowest_sal AND j.highest_sal);`,
   note:'JOIN per rang (non-equijoin): la condició BETWEEN no utilitza igualtat sinó un interval de valors.'},
  {n:8,txt:'Mostra el cognom i la data de contractació de tots els empleats contractats DESPRÉS de Davies.',
   sol:`SELECT e.last_name, e.hire_date\nFROM   employees e\nJOIN   employees davies ON (davies.last_name = 'Davies')\nWHERE  davies.hire_date < e.hire_date;`},
  {n:9,txt:'Mostra el cognom i data de contractació dels empleats contractats ABANS que el seu cap, juntament amb el cognom i data del cap.',
   sol:`SELECT w.last_name, w.hire_date,\n       m.last_name, m.hire_date\nFROM   employees w\nJOIN   employees m ON (w.manager_id = m.employee_id)\nWHERE  w.hire_date < m.hire_date;`}
];

var TOPIC = 't6';

EXDATA_T6.forEach(function(ex) {
  var c = document.getElementById('ex-body');
  var div = document.createElement('div');
  div.className = 'exercise';
  div.id = TOPIC + '-ex' + ex.n;
  var note = ex.note ? '<div class="ri-note">'+ex.note+'</div>' : '';
  var ansId = 'ans_' + TOPIC + '_' + ex.n;
  var sqlId = 'sql_' + TOPIC + '_' + ex.n;
  div.innerHTML =
    '<div class="ex-head">' +
      '<div class="ex-num">' + ex.n + '</div>' +
      '<div><div class="ex-name">Exercici ' + ex.n + '</div></div>' +
    '</div>' +
    '<div class="ex-enunciat">' + ex.txt + '</div>' +
    '<button class="ri-btn" onclick="reveal(this,\'' + ansId + '\')">&#9654; Veure soluci&#243;</button>' +
    '<div class="ri-ans" id="' + ansId + '">' +
      '<div class="ri-ans-label">Soluci&#243;</div>' +
      '<code class="sql-out" id="' + sqlId + '"></code>' +
      note +
    '</div>';
  c.appendChild(div);
  var sqlEl = document.getElementById(sqlId);
  if (sqlEl) sqlEl.innerHTML = cSQL(ex.sol);
});
</script>
